name: Security CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep pip-audit

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: Run Unit and AI Security Tests
        run: pytest -v

      - name: Run Bandit SAST
        continue-on-error: true
        run: bandit -r app/ -f json -o reports/bandit-report.json

      - name: Run Semgrep SAST
        continue-on-error: true
        run: |
          semgrep scan \
            --config security/semgrep/rules.yml \
            --json \
            --output reports/semgrep-report.json \
            app/

      - name: Run pip-audit Dependency Scan
        continue-on-error: true
        run: pip-audit -f json -o reports/dependency-report.json

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Run Trivy Container Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "vulnfinbot:latest"
          format: "json"
          output: "reports/trivy-report.json"

      - name: Run OWASP ZAP DAST Baseline Scan
        continue-on-error: true
        run: |
          docker run -d --name vulnfinbot-dast -p 5000:5000 vulnfinbot:latest
          sleep 5
          chmod 777 reports
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000 \
            -J zap-report.json || true
          docker stop vulnfinbot-dast && docker rm vulnfinbot-dast

      - name: Upload all security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn