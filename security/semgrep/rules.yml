rules:
  - id: python-no-eval
    patterns:
      - pattern: eval(...)
    message: "Avoid using eval() as it allows arbitrary code execution."
    languages: [python]
    severity: ERROR

  - id: python-no-exec
    patterns:
      - pattern: exec(...)
    message: "Avoid using exec() due to arbitrary code execution risk."
    languages: [python]
    severity: ERROR

  - id: flask-debug-enabled
    patterns:
      - pattern: $APP.run(..., debug=True, ...)
    message: "Flask debug mode must not be enabled in production."
    languages: [python]
    severity: WARNING

  - id: hardcoded-secret-pattern
    pattern-regex: "(sk-[a-zA-Z0-9-]{8,}|API_KEY\\s*=\\s*['\"][^'\"]+['\"])"
    message: "Potential hardcoded API key or secret detected."
    languages: [python]
    severity: WARNING
